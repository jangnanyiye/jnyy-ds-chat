# DS Chat 源站入口
# 放置位置：/etc/nginx/conf.d/ds-chat.conf
# 安装前请替换 server_name 和证书路径。
# 如果使用 Caddy / Traefik / 云负载均衡，可以跳过本文件，直接把静态文件
# 和 /api 反代到 127.0.0.1:8787。

server {
    listen 443 ssl;
    server_name chat.example.com;

    ssl_certificate     /etc/nginx/ssl/chat.example.com.crt;
    ssl_certificate_key /etc/nginx/ssl/chat.example.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /opt/ds-chat/web;
    index index.html;

    client_max_body_size 110m;
    client_body_timeout 300s;
    send_timeout 600s;

    access_log /var/log/nginx/ds-chat.access.log;
    error_log  /var/log/nginx/ds-chat.error.log warn;

    # SSE 不能经过任何压缩或缓冲
    gzip off;

    # PWA 元数据与 Service Worker 不缓存，确保更新及时生效
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /sw.js {
        default_type application/javascript;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_set_header Accept-Encoding   "";

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_redirect off;

        proxy_connect_timeout 15s;
        proxy_send_timeout    1800s;
        proxy_read_timeout    1800s;

        add_header X-Accel-Buffering no always;
    }

    location / {
        try_files $uri $uri/ /index.html;

        add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data: https:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
}
